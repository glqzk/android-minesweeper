name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Gradle Wrapper (if needed)
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Gradle wrapper JAR not found, downloading..."
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar || true
        fi
      
    - name: Build with Gradle
      run: ./gradlew assembleRelease --no-daemon
      
    - name: Check APK exists
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "APK file found!"
          ls -lh app/build/outputs/apk/release/app-release.apk
        else
          echo "APK file not found!"
          echo "Checking directory contents:"
          ls -la app/build/outputs/apk/release/ || echo "Release directory does not exist"
          find app/build/outputs -name "*.apk" || echo "No APK files found"
          exit 1
        fi
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        if-no-files-found: error

