name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Gradle Wrapper (if needed)
      run: |
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          echo "Gradle wrapper JAR not found, downloading..."
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar || true
        fi
      
    - name: Build with Gradle (Release)
      run: ./gradlew assembleRelease --no-daemon
      
    - name: Build with Gradle (Debug - fallback)
      run: ./gradlew assembleDebug --no-daemon
      continue-on-error: true
      
    - name: Find and list APK files
      run: |
        echo "Searching for APK files..."
        find app/build/outputs -name "*.apk" -type f || echo "No APK files found in outputs"
        echo ""
        echo "Checking release directory:"
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "Release directory does not exist"
        echo ""
        echo "Checking debug directory:"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug directory does not exist"
        echo ""
        echo "All APK files found:"
        find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: hashFiles('app/build/outputs/apk/release/app-release.apk') != ''
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 30
      
    - name: Upload Debug APK (fallback)
      uses: actions/upload-artifact@v4
      if: hashFiles('app/build/outputs/apk/release/app-release.apk') == '' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
      
    - name: Upload any APK found
      uses: actions/upload-artifact@v4
      if: hashFiles('app/build/outputs/apk/release/app-release.apk') == '' && hashFiles('app/build/outputs/apk/debug/app-debug.apk') == ''
      with:
        name: app-apk
        path: app/build/outputs/**/*.apk
        retention-days: 30
        if-no-files-found: warn

